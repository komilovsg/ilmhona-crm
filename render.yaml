# Render blueprint: the free API of the ilmhona CRM (Vercel proxies /api/* here).
# The live service ilmhona-api was created from these settings with the Render CLI/API; its
# secrets were generated locally and live only in Render and GitHub (docs/ops/deploy.md).
# Database: Neon (direct, not pooled, connection strings).
services:
  - type: web
    name: ilmhona-api
    runtime: docker
    rootDir: apps/api
    plan: free
    region: frankfurt
    # Returns {"status":"ok","version":"<git sha>"}: the deploy workflow waits for the sha.
    healthCheckPath: /api/health
    # Deploys come from .github/workflows/deploy-api.yml after the migration ran. The owner
    # URL lives only in GitHub, never in this service.
    autoDeploy: false
    envVars:
      - key: ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # postgresql+asyncpg://ilm_app:<password>@<neon direct host>/neondb?ssl=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # The onrender.com URL is public; this secret keeps out everyone but our Vercel proxy, which
      # sends it in X-Proxy-Secret (app/core/proxy.py, docs/ops/deploy.md).
      - key: PROXY_SHARED_SECRET
        sync: false
      # FORWARDED_ALLOW_IPS is left at the uvicorn default (127.0.0.1): the client address for the
      # login lockout comes from the X-Client-IP the web proxy derives from Vercel's own header,
      # NOT from a browser-supplied X-Forwarded-For (which trusting any peer's XFF would let a
      # spoofed header steer the per-address lockout).
