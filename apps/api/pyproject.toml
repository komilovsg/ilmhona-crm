[project]
name = "ilmhona-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "fastapi>=0.120",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "sentry-sdk[fastapi]>=2.72.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/*" = ["E501", "ASYNC230", "S", "B"]

[tool.mypy]
strict = true
plugins = []
