# Daily job of production (docs/ops/deploy.md#daily-job): cohort statuses by their dates, the
# enrollments of finished cohorts, and old login-attempt rows are deleted
# (`python -m app.cli daily`). Runs as the restricted runtime role ilm_app, never with the
# owner URL. 19:30 UTC = 00:30 Asia/Dushanbe. Safe to re-run.
name: daily

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: api-production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run --no-sync python -m app.cli daily
        env:
          ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
